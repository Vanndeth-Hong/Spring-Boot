server:
  port: 8080 # Kept at root level so ${server.port} resolves correctly

file:
  client-path: /file
  storage-location: /Users/macbookpro/Pictures/ite-file/
  base-uri: http://localhost:${server.port:8080}${file.client-path}/

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${URL}
    username: ${USERNAME}
    password: ${PASSWORD}
  application:
    name: ite3rdecommerce
